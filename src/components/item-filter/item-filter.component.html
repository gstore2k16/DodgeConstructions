@defer (on viewport) {
    <div class="item-filter__header-row">
        <div class="item-filter__search-box">
            <svg class="item-filter__search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
                type="text"
                class="item-filter__search-input"
                placeholder="Search products…"
                [ngModel]="searchTerm()"
                (ngModelChange)="onSearchInput($event)"
            />
        </div>
    </div>

    <!-- Filter & Sort controls bar -->
    <div class="item-filter__bar">
        <!-- Category Filter -->
        <div class="item-filter__group">
            <label for="category-select" class="item-filter__label">Category</label>
            <select
                id="category-select"
                class="item-filter__select"
                [ngModel]="selectedCategory()"
                (ngModelChange)="onCategorySelect($event)">
                @for (cat of categories(); track cat) {
                    <option [value]="cat">{{ cat }}</option>
                }
            </select>
        </div>

        <!-- Price Range Filter -->
        <div class="item-filter__group item-filter__group--price">
            <label class="item-filter__label">Price Range</label>
            <div class="item-filter__price-inputs">
                <input
                    type="number"
                    class="item-filter__price-input"
                    placeholder="Min $"
                    min="0"
                    [ngModel]="minPrice()"
                    (ngModelChange)="onMinInput($event)"
                />
                <span class="item-filter__price-separator">-</span>
                <input
                    type="number"
                    class="item-filter__price-input"
                    placeholder="Max $"
                    min="0"
                    [ngModel]="maxPrice()"
                    (ngModelChange)="onMaxInput($event)"
                />
            </div>
        </div>

        <!-- Sort Control -->
        <div class="item-filter__group">
            <label for="sort-select" class="item-filter__label">Sort By</label>
            <select
                id="sort-select"
                class="item-filter__select"
                [ngModel]="sortOrder()"
                (ngModelChange)="onSortSelect($event)">
                <option value="default">Default</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
            </select>
        </div>

        <!-- In-Stock Checkbox -->
        <div class="item-filter__group item-filter__group--stock">
            <label class="item-filter__stock-label">
                <input
                    type="checkbox"
                    class="item-filter__checkbox"
                    [ngModel]="inStockOnly()"
                    (ngModelChange)="onStockToggle($event)"
                />
                In-stock only
            </label>
        </div>

        <!-- Reset Filters Button -->
        <div class="item-filter__group item-filter__group--reset">
            <button class="item-filter__reset-btn" (click)="onResetClick()" title="Reset all filters">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
                Reset
            </button>
        </div>
    </div>
} @placeholder {
    <div class="item-filter__skeleton-container">
        <div class="item-filter__header-row">
            <div class="item-filter__skeleton-search"></div>
        </div>
        <div class="item-filter__bar item-filter__skeleton-bar">
            <div class="item-filter__skeleton-group">
                <div class="item-filter__skeleton-label"></div>
                <div class="item-filter__skeleton-input"></div>
            </div>
            <div class="item-filter__skeleton-group">
                <div class="item-filter__skeleton-label"></div>
                <div class="item-filter__skeleton-input item-filter__skeleton-input--wide"></div>
            </div>
            <div class="item-filter__skeleton-group">
                <div class="item-filter__skeleton-label"></div>
                <div class="item-filter__skeleton-input"></div>
            </div>
            <div class="item-filter__skeleton-group item-filter__skeleton-group--stock">
                <div class="item-filter__skeleton-input item-filter__skeleton-input--pill"></div>
            </div>
        </div>
    </div>
}
