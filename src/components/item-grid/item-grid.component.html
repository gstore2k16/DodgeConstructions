<div class="item-grid" role="region" aria-label="Product items grid">
    @for (item of items(); track item.id) {
        @defer (on viewport) {
            <app-item-card [item]="item"></app-item-card>
        } @placeholder {
            <div class="item-grid__skeleton-card" aria-hidden="true">
                <div class="item-grid__skeleton-image"></div>
                <div class="item-grid__skeleton-info">
                    <div class="item-grid__skeleton-line item-grid__skeleton-line--wide"></div>
                    <div class="item-grid__skeleton-line item-grid__skeleton-line--medium"></div>
                    <div class="item-grid__skeleton-line item-grid__skeleton-line--narrow"></div>
                </div>
            </div>
        } @error {
            <app-error message="Failed to load product card."></app-error>
        }
    }
</div>
