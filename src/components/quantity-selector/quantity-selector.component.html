<div class="quantity-selector">
    <button
        class="qty-btn"
        (click)="decrement()"
        [disabled]="quantity() <= min()"
        aria-label="Decrease quantity">
        −
    </button>
    <span class="qty-value">{{ quantity() }}</span>
    <button
        class="qty-btn"
        (click)="increment()"
        [disabled]="quantity() >= max()"
        aria-label="Increase quantity">
        +
    </button>
</div>
