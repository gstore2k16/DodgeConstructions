<ng-container>
    <!-- Breadcrumb component -->
    <app-breadcrumb [category]="item().category"></app-breadcrumb>

    @defer (on immediate) {
        <article class="item-detail-view__layout">
            <!-- Product image with zooming option -->
            <div class="item-detail-view__image-wrapper">
                <app-image-zoom [src]="item().image" [alt]="item().name"></app-image-zoom>
            </div>

            <!-- Product info -->
            <div class="item-detail-view__info">
                <h1 class="item-detail-view__name">{{ item().name }}</h1>
                <p class="item-detail-view__price">{{ item().price | currency:'USD':'symbol':'1.2-2' }}</p>
                <p class="item-detail-view__description">{{ item().description }}</p>

                <!-- Stock badge + count -->
                <div class="item-detail-view__stock-row">
                    <span class="item-detail-view__stock-badge"
                          [class.item-detail-view__stock-badge--in-stock]="item().inStock"
                          [class.item-detail-view__stock-badge--out-of-stock]="!item().inStock">
                        @if (item().inStock) {
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                            In Stock
                        } @else {
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                            Out of Stock
                        }
                    </span>
                    @if (item().inStock) {
                        <span class="item-detail-view__stock-count">{{ item().stockCount }} left in stock</span>
                    }
                </div>

                <!-- Quantity selector (only when in stock) -->
                @if (item().inStock) {
                    <app-quantity-selector
                        [quantity]="quantity()"
                        [max]="item().stockCount"
                        (quantityChange)="onQuantityChange($event)">
                    </app-quantity-selector>

                    <!-- Add to Cart button -->
                    <button type="button" class="item-detail-view__btn-add" [attr.aria-label]="'Add ' + item().name + ' to cart'">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        Add to Cart
                    </button>
                }

                <!-- Product Details / Features component -->
                <app-item-features [features]="item().features"></app-item-features>
            </div>
        </article>
    } @placeholder {
        <div class="item-detail-view__layout item-detail-view__layout--skeleton" aria-hidden="true">
            <!-- Image Skeleton -->
            <div class="item-detail-view__image-wrapper item-detail-view__image-wrapper--skeleton"></div>

            <!-- Detail Info Skeleton -->
            <div class="item-detail-view__info item-detail-view__info--skeleton">
                <div class="item-detail-view__skeleton-line item-detail-view__skeleton-line--title"></div>
                <div class="item-detail-view__skeleton-line item-detail-view__skeleton-line--price"></div>
                <div class="item-detail-view__skeleton-line item-detail-view__skeleton-line--description"></div>
                <div class="item-detail-view__skeleton-line item-detail-view__skeleton-line--description item-detail-view__skeleton-line--short"></div>
                <div class="item-detail-view__skeleton-line item-detail-view__skeleton-line--stock-badge"></div>
                <div class="item-detail-view__skeleton-box item-detail-view__skeleton-box--qty"></div>
                <div class="item-detail-view__skeleton-box item-detail-view__skeleton-box--btn"></div>

                <!-- Product Details / Features Skeleton -->
                <div class="item-detail-view__skeleton-features">
                    <div class="item-detail-view__skeleton-line item-detail-view__skeleton-line--feature-title"></div>
                    <div class="item-detail-view__skeleton-line item-detail-view__skeleton-line--feature-bullet"></div>
                    <div class="item-detail-view__skeleton-line item-detail-view__skeleton-line--feature-bullet"></div>
                    <div class="item-detail-view__skeleton-line item-detail-view__skeleton-line--feature-bullet"></div>
                </div>
            </div>
        </div>
    } @error {
        <app-error message="Failed to load product details view."></app-error>
    }
</ng-container>
