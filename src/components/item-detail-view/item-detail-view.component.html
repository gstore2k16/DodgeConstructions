<section class="detail-page">
    <!-- Breadcrumb component -->
    <app-breadcrumb [category]="item().category"></app-breadcrumb>

    <div class="detail-layout">
        <!-- Product image with zooming option -->
        @defer (on viewport) {
            <div class="detail-image-wrapper">
                <app-image-zoom [src]="item().image" [alt]="item().name"></app-image-zoom>
            </div>
        } @placeholder {
            <div class="detail-image-wrapper skeleton-image"></div>
        }

        <!-- Product info -->
        <div class="detail-info">
            <h1 class="detail-name">{{ item().name }}</h1>
            <p class="detail-price">{{ item().price | currency:'USD':'symbol':'1.2-2' }}</p>
            <p class="detail-description">{{ item().description }}</p>

            <!-- Stock badge + count -->
            <div class="detail-stock-row">
                <span class="stock-badge"
                      [class.in-stock]="item().inStock"
                      [class.out-of-stock]="!item().inStock">
                    @if (item().inStock) {
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        In Stock
                    } @else {
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                        Out of Stock
                    }
                </span>
                @if (item().inStock) {
                    <span class="stock-count">{{ item().stockCount }} left in stock</span>
                }
            </div>

            <!-- Quantity selector (only when in stock) -->
            @if (item().inStock) {
                <app-quantity-selector
                    [quantity]="quantity()"
                    [max]="item().stockCount"
                    (quantityChange)="onQuantityChange($event)">
                </app-quantity-selector>

                <!-- Add to Cart button -->
                <button class="btn-add-to-cart">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Add to Cart
                </button>
            }

            <!-- Product Details / Features component -->
            <app-item-features [features]="item().features"></app-item-features>
        </div>
    </div>
</section>
