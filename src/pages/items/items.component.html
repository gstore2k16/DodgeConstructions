<section class="items-page">
    <h2>Products</h2>

    <!-- Reusable Filter & Sort Component -->
    <app-item-filter
        [categories]="categories()"
        [searchTerm]="filter()"
        [selectedCategory]="selectedCategory()"
        [minPrice]="minPrice()"
        [maxPrice]="maxPrice()"
        [inStockOnly]="inStockOnly()"
        [sortOrder]="sortOrder()"
        (searchTermChange)="onSearchChange($event)"
        (categoryChange)="onCategoryChange($event)"
        (minPriceChange)="onMinPriceChange($event)"
        (maxPriceChange)="onMaxPriceChange($event)"
        (inStockChange)="onInStockToggle($event)"
        (sortOrderChange)="onSortChange($event)"
        (reset)="resetFilters()">
    </app-item-filter>

    <!-- Loading state -->
    @if (loading()) {
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading products…</p>
        </div>
    }

    <!-- Error state -->
    @if (error()) {
        <div class="error-state">
            <p>{{ error() }}</p>
        </div>
    }

    <!-- Product grid component -->
    @if (!loading() && !error()) {
        @if (filteredItems().length === 0) {
            <div class="empty-state">
                <p>No products match your search or filter criteria.</p>
                <button class="btn-reset" (click)="resetFilters()">Clear Filters</button>
            </div>
        } @else {
            <app-item-grid [items]="filteredItems()"></app-item-grid>
        }
    }
</section>
