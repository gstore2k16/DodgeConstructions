<section class="items-page">
    <!-- Header row: title + filter input -->
    <div class="items-header">
        <h2>Products</h2>
        <div class="search-box">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
                type="text"
                placeholder="Filter by name"
                [(ngModel)]="filter"
                (ngModelChange)="onFilterChange()"
            />
        </div>
    </div>

    <!-- In-stock toggle -->
    <div class="stock-filter">
        <label class="stock-label">
            <input
                type="checkbox"
                [(ngModel)]="inStockOnly"
                (ngModelChange)="onFilterChange()"
            />
            In-stock only
        </label>
    </div>

    <!-- Loading state -->
    @if (loading()) {
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading products…</p>
        </div>
    }

    <!-- Error state -->
    @if (error()) {
        <div class="error-state">
            <p>{{ error() }}</p>
        </div>
    }

    <!-- Product grid component -->
    @if (!loading() && !error()) {
        @if (filteredItems().length === 0) {
            <div class="empty-state">
                <p>No products match your search.</p>
            </div>
        } @else {
            <app-item-grid [items]="filteredItems()"></app-item-grid>
        }
    }
</section>
